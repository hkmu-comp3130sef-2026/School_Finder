name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Install Protobuf Compiler
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Paths
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true
      
      - name: Setup gomobile
        run: make setup

      - name: Build APK
        env:
          KEYSTORE_PATH: ../keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: release
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: make apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Install Protobuf Compiler
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Paths
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true
      
      - name: Verify CocoaPods
        run: pod --version

      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Setup gomobile
        run: make setup
      
      - name: Build unsigned IPA
        run: make ipa
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/ipa/SchoolFinder.ipa

  release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: ./release
      
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: ./release
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release/app-release.apk
            ./release/SchoolFinder.ipa
          body: |
            ## Installation
            
            ### Android
            Download and install the APK file directly.
            
            ### iOS (Sideloading)
            Use [AltStore](https://altstore.io/) or [Sideloadly](https://sideloadly.io/) to install the IPA with your Apple ID.
            Note: Free Apple IDs require re-signing every 7 days.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
